<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E23744" />
    <!--
      The manifest is added here rather than written as a plain <link>, because
      a plain one cannot be taken back. The browser decides whether this page is
      installable while it parses the head; the admin's `pwa` flag only arrives
      later, over the network. Removing the link at that point is too late — the
      app is already installable, which is exactly the bug this replaced.

      So the last known answer is read from storage during parse. Unknown counts
      as on, so a first-time visitor still gets the app; turning the flag off
      takes effect from the next load. Keep the key in step with
      features/pwa/pwaFlagCache.ts.
    -->
    <script>
      (function () {
        var enabled = true
        try {
          enabled = localStorage.getItem('listee:pwa:enabled') !== '0'
        } catch (e) {
          /* Storage blocked — fall back to on. */
        }
        if (enabled) {
          var link = document.createElement('link')
          link.rel = 'manifest'
          link.href = '/manifest.webmanifest'
          document.head.appendChild(link)
        }
      })()
    </script>
    <meta
      name="description"
      content="Listee — scan, spin and win rewards at local businesses near you."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Listee" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing (Milestone 15 — SEO) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Listee" />
    <meta property="og:title" content="Listee — Rewards Around You" />
    <meta property="og:description" content="Scan, spin and win rewards at local businesses near you." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Listee — Rewards Around You" />
    <meta name="twitter:description" content="Scan, spin and win rewards at local businesses near you." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <title>Listee — Rewards Around You</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
